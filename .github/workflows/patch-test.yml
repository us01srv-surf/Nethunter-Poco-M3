name: Test Injection Patch

on:
  workflow_dispatch:

jobs:
  try-patch:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: qualcomm-3.0-injection
          fetch-depth: 0

      - name: Download qcacld-3.0 injection patch (4.14)
        run: |
          curl -sL -o injection.patch \
            "https://gitlab.com/kalilinux/nethunter/build-scripts/kali-nethunter-kernel-builder/-/raw/main/patches/4.14/add-qcacld-3.0-injection-4.14.patch"
          wc -l injection.patch
          grep -c '^diff --git' injection.patch

      - name: Try git apply (3-way)
        id: apply3
        run: |
          set +e
          git apply -3 --verbose injection.patch > apply-3way.log 2>&1
          echo "exit=$?" >> apply-3way.log
          tail -5 apply-3way.log

      - name: If 3-way failed, try patch with fuzz and collect rejects
        if: steps.apply3.outputs.exit != '0'
        run: |
          git checkout -- . 2>/dev/null
          git clean -fd drivers/staging/ 2>/dev/null
          set +e
          patch -p1 -F3 --no-backup-if-mismatch < injection.patch > patch-fuzz.log 2>&1
          echo "exit=$?" >> patch-fuzz.log
          echo "=== REJECT FILES ===" >> patch-fuzz.log
          find . -name '*.rej' >> patch-fuzz.log 2>/dev/null
          echo "=== FUZZ RESULT SUMMARY ===" >> patch-fuzz.log
          grep -E '^(Hunk|patching|FAILED|saving)' patch-fuzz.log | head -100 >> patch-fuzz.log
          echo done

      - name: Collect report
        if: always()
        run: |
          mkdir -p report
          cp apply-3way.log report/ 2>/dev/null || true
          cp patch-fuzz.log report/ 2>/dev/null || true
          # dump every reject file
          find . -name '*.rej' -path './drivers/*' | while read f; do
            dest="report/rejects/$(echo "$f" | tr '/' '_')"
            mkdir -p "$(dirname "$dest")"
            cp "$f" "$dest"
          done
          ls -R report/ | head -50

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patch-test-report
          path: report/
