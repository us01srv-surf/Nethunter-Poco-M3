name: Build Nethunter Kernel

on:
  push:
    branches: [nethunter-stable]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: nethunter-stable
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex \
            g++-multilib gcc-multilib git gnupg \
            lib32ncurses5-dev lib32readline-dev libssl-dev \
            libxml2 libxslt1-dev lz4 zip zlib1g-dev \
            python3 python3-pip python3-venv \
            libncurses-dev

      - name: Install Clang 18 from LLVM apt repo
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          echo "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-18 main" | sudo tee /etc/apt/sources.list.d/llvm-18.list
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 llvm-18
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-18 100
          sudo update-alternatives --install /usr/bin/lld lld /usr/bin/lld-18 100
          sudo update-alternatives --install /usr/bin/ld.lld ld.lld /usr/bin/ld.lld-18 100
          sudo update-alternatives --install /usr/bin/llvm-ar llvm-ar /usr/bin/llvm-ar-18 100
          sudo update-alternatives --install /usr/bin/llvm-nm llvm-nm /usr/bin/llvm-nm-18 100
          sudo update-alternatives --install /usr/bin/llvm-objcopy llvm-objcopy /usr/bin/llvm-objcopy-18 100
          sudo update-alternatives --install /usr/bin/llvm-strip llvm-strip /usr/bin/llvm-strip-18 100
          clang --version
          ld.lld --version

      - name: Apply USB Serial + NRF52 BLE config
        run: |
          cp arch/arm64/configs/vendor/nh_defconfig arch/arm64/configs/vendor/nh_defconfig.orig
          cat >> arch/arm64/configs/vendor/nh_defconfig << 'CONF'
          CONFIG_USB_SERIAL=y
          CONFIG_USB_SERIAL_GENERIC=y
          CONFIG_USB_SERIAL_CDC_ACM=y
          CONFIG_USB_SERIAL_CH341=y
          CONFIG_USB_SERIAL_CP210X=y
          CONFIG_USB_SERIAL_FTDI_SIO=y
          CONFIG_USB_SERIAL_OPTION=y
          CONFIG_USB_SERIAL_PL2303=y
          CONFIG_BT=y
          CONFIG_BT_BREDR=y
          CONFIG_BT_LE=y
          CONFIG_BT_HCIBTUSB=y
          CONFIG_BT_HCIBTUSB_BCM=y
          CONFIG_BT_HCIBTUSB_RTL=y
          CONFIG_BT_HCIUART=y
          CONFIG_BT_HCIUART_H4=y
          CONFIG_BT_HCIUART_LL=y
          CONFIG_BT_HCIUART_3WIRE=y
          CONFIG_BT_HCIVHCI=y
          CONFIG_BT_6LOWPAN=y
          CONFIG_BT_HIDP=y
          CONFIG_BT_RFCOMM=y
          CONFIG_BT_BNEP=y
          CONFIG_USB_ACM=y
          CONFIG_USB_STORAGE=y
          CONF
          echo "Config fragment applied"

      - name: Build kernel
        run: |
          export KBUILD_BUILD_USER=nh-builder
          export KBUILD_BUILD_HOST=github
          make O=out CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 ARCH=arm64 vendor/nh_defconfig
          make O=out CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 ARCH=arm64 -j$(nproc) 2>&1 | tee build.log
          ls -lh out/arch/arm64/boot/Image || echo "Image not found, checking build.log..."
          tail -50 build.log

      - name: Package AnyKernel3
        if: success()
        run: |
          cp out/arch/arm64/boot/Image .
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git /tmp/ak3
          mkdir -p nethunter-kernel
          cp /tmp/ak3/META-INF -r nethunter-kernel/
          cp /tmp/ak3/tools -r nethunter-kernel/
          cp /tmp/ak3/anykernel.sh nethunter-kernel/
          cp Image nethunter-kernel/
          sed -i 's/do.devicecheck=1/do.devicecheck=0/' nethunter-kernel/anykernel.sh
          sed -i 's/is_slot_device=1/is_slot_device=0/' nethunter-kernel/anykernel.sh
          cd nethunter-kernel
          zip -r9 ../nethunter-citrus-usb-nrf52.zip .
          cd ..
          ls -lh nethunter-citrus-usb-nrf52.zip

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nethunter-citrus-kernel
          path: nethunter-citrus-usb-nrf52.zip
          retention-days: 30
