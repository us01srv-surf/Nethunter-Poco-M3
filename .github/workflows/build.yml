name: Build Nethunter Kernel

on:
  push:
    branches: [nethunter-stable]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: nethunter-stable
          submodules: recursive

      - name: Install build dependencies and LLVM
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            git gnupg \
            lib32ncurses5-dev lib32readline-dev libssl-dev \
            libxml2 libxslt1-dev lz4 zip zlib1g-dev \
            python3 \
            clang lld llvm llvm-dev
          sudo ln -sf /usr/bin/python3 /usr/bin/python2

      - name: Fix Python 2 scripts for Python 3
        run: |
          sed -i 's/^PYTHON2\s*=\s*python2$/PYTHON2\t\t= python3/' Makefile
          python3 << 'PATCH'
          with open('scripts/dtc/libfdt/mkdtboimg.py', 'r') as f:
              content = f.read()
          content = content.replace('xrange(', 'range(')
          content = content.replace("array('c', ' ' * self.__metadata_size)",
                                    "bytearray(b' ' * self.__metadata_size)")
          content = content.replace('dt_entry_buf = ""', 'dt_entry_buf = b""')
          with open('scripts/dtc/libfdt/mkdtboimg.py', 'w') as f:
              f.write(content)
          PATCH

      - name: Build kernel
        run: |
          export KBUILD_BUILD_USER=nh-builder
          export KBUILD_BUILD_HOST=github
          set -e

          # Step 1: Generate .config from defconfig (no olddefconfig!)
          echo "=== Generating .config from vendor/nh_defconfig ==="
          make O=out CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 IAS=1 ARCH=arm64 vendor/nh_defconfig

          # Step 2: Force critical configs
          echo "=== Forcing USB/BT configs ==="
          scripts/config --file out/.config --enable USB_ACM
          scripts/config --file out/.config --enable USB_SERIAL
          scripts/config --file out/.config --enable USB_SERIAL_GENERIC
          scripts/config --file out/.config --enable USB_SERIAL_CDC_ACM
          scripts/config --file out/.config --enable USB_SERIAL_CH341
          scripts/config --file out/.config --enable USB_SERIAL_CP210X
          scripts/config --file out/.config --enable USB_SERIAL_FTDI_SIO
          scripts/config --file out/.config --enable USB_SERIAL_OPTION
          scripts/config --file out/.config --enable USB_SERIAL_PL2303
          scripts/config --file out/.config --enable BT_HCIBTUSB
          scripts/config --file out/.config --enable BT_HCIUART
          scripts/config --file out/.config --enable BT_HCIUSB

          # Step 3: Verify configs before build
          echo "=== Pre-build .config USB verification ==="
          for cfg in CONFIG_USB_ACM CONFIG_USB_SERIAL CONFIG_USB_SERIAL_CH341 CONFIG_BT_HCIBTUSB CONFIG_BT_HCIUART; do
            val=$(grep "^${cfg}=" out/.config 2>/dev/null || echo "MISSING")
            echo "$cfg: $val"
            if [ "$val" = "MISSING" ] || [ "$val" = "# ${cfg} is not set" ]; then
              echo "FATAL: $cfg missing after forcing!"
              exit 1
            fi
          done

          # Step 4: Build directly (NO olddefconfig - it strips forced configs!)
          echo "=== Starting kernel build ==="
          make O=out CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 IAS=1 ARCH=arm64 -j$(nproc) 2>&1 | tee build.log

          # Step 5: Verify built Image
          echo "=== Post-build verification ==="
          strings out/arch/arm64/boot/Image | grep -c "cdc_acm\|usb_serial\|ch341\|cp210x\|pl2303" | xargs -I{} echo "USB driver strings found: {}"
          echo "=== Final .config USB settings ==="
          grep -E "^CONFIG_USB_ACM=|^CONFIG_USB_SERIAL=|^CONFIG_USB_SERIAL_CH341=" out/.config

      - name: Package AnyKernel3
        run: |
          cp out/arch/arm64/boot/Image .
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git /tmp/ak3
          mkdir -p nethunter-kernel
          cp /tmp/ak3/META-INF -r nethunter-kernel/
          cp /tmp/ak3/tools -r nethunter-kernel/
          cp /tmp/ak3/anykernel.sh nethunter-kernel/
          cp Image nethunter-kernel/

          cd nethunter-kernel

          # Fix anykernel.sh for POCO M3
          perl -pi -e 's/do\.devicecheck=\d/do.devicecheck=0/i' anykernel.sh
          perl -pi -e 's/do\.systemless=\d/do.systemless=0/i' anykernel.sh
          perl -pi -e 's|^BLOCK=.*|BLOCK=/dev/block/bootdevice/by-name/boot;|i' anykernel.sh
          perl -pi -e 's|^IS_SLOT_DEVICE=\d|IS_SLOT_DEVICE=0;|i' anykernel.sh
          perl -pi -e 's|^#IS_SLOT_DEVICE=0|IS_SLOT_DEVICE=0;|i' anykernel.sh

          # Fix device names
          python3 -c "
          with open('anykernel.sh', 'r') as f:
              c = f.read()
          import re
          c = re.sub(r'device\.name\d=\S+', '', c)
          c = c.replace(\"device.name5=\", \"device.name1=citrus\")
          with open('anykernel.sh', 'w') as f:
              f.write(c)
          "

          # Clean up double semicolons
          sed -i 's/;;/;/g' anykernel.sh

          # Remove Galaxy Nexus patches
          sed -i '/init.tuna.rc/d; /fstab.tuna/d; /cpuctl cpu,timer_slack/d; /nodiratime barrier=0/d; /bootscript/d; /usbdisk/d' anykernel.sh

          # Verify
          echo "=== anykernel.sh verification ==="
          grep -E "^BLOCK=|^IS_SLOT|do\.devicecheck|do\.systemless|device\.name1" anykernel.sh

          # Package
          zip -r9 ../nethunter-citrus-usb-nrf52.zip .
          cd ..
          ls -lh nethunter-citrus-usb-nrf52.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nethunter-citrus-kernel
          path: nethunter-citrus-usb-nrf52.zip
          retention-days: 30
