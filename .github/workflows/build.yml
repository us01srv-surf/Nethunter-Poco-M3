name: Build Nethunter Kernel

on:
  push:
    branches: [nethunter-stable]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: nethunter-stable
          submodules: recursive

      - name: Install build dependencies and LLVM
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            git gnupg \
            lib32ncurses5-dev lib32readline-dev libssl-dev \
            libxml2 libxslt1-dev lz4 zip zlib1g-dev \
            python3 \
            clang lld llvm llvm-dev
          sudo ln -sf /usr/bin/python3 /usr/bin/python2

      - name: Fix Python 2 scripts for Python 3
        run: |
          # Patch root Makefile: PYTHON2 = python3
          sed -i 's/^PYTHON2\s*=\s*python2$/PYTHON2\t\t= python3/' Makefile
          echo "PYTHON2 patched to: $(grep '^PYTHON2' Makefile)"

          # Comprehensive Python 3 patch for mkdtboimg.py
          python3 << 'PATCH'
          with open('scripts/dtc/libfdt/mkdtboimg.py', 'r') as f:
              content = f.read()
          content = content.replace('xrange(', 'range(')
          content = content.replace("array('c', ' ' * self.__metadata_size)",
                                    "bytearray(b' ' * self.__metadata_size)")
          content = content.replace('dt_entry_buf = ""', 'dt_entry_buf = b""')
          with open('scripts/dtc/libfdt/mkdtboimg.py', 'w') as f:
              f.write(content)
          print('mkdtboimg.py patched for Python 3')
          PATCH

          # Verify no Python 2 syntax remains
          python3 -c "import ast; ast.parse(open('scripts/dtc/libfdt/mkdtboimg.py').read()); print('Syntax OK')"

      - name: Build kernel
        run: |
          export KBUILD_BUILD_USER=nh-builder
          export KBUILD_BUILD_HOST=github
          set -e

          # Step 1: Generate .config from defconfig
          echo "=== Generating .config from vendor/nh_defconfig ==="
          make O=out CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 IAS=1 ARCH=arm64 vendor/nh_defconfig

          # Step 2: VERIFY and FORCE critical configs
          echo "=== Checking .config for USB_ACM ==="
          if ! grep -q "CONFIG_USB_ACM=y" out/.config; then
            echo "WARNING: CONFIG_USB_ACM=y NOT found in .config! Forcing it..."
            # Force all USB serial configs using scripts/config
            scripts/config --file out/.config --enable USB_ACM
            scripts/config --file out/.config --enable USB_SERIAL
            scripts/config --file out/.config --enable USB_SERIAL_GENERIC
            scripts/config --file out/.config --enable USB_SERIAL_CDC_ACM
            scripts/config --file out/.config --enable USB_SERIAL_CH341
            scripts/config --file out/.config --enable USB_SERIAL_CP210X
            scripts/config --file out/.config --enable USB_SERIAL_FTDI_SIO
            scripts/config --file out/.config --enable USB_SERIAL_OPTION
            scripts/config --file out/.config --enable USB_SERIAL_PL2303
            # Re-run olddefconfig to resolve dependencies
            make O=out CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 IAS=1 ARCH=arm64 olddefconfig
            echo "=== After forcing, checking again ==="
          fi

          # Step 3: Final verification - FAIL build if still missing
          echo "=== Final .config verification ==="
          echo "USB_ACM: $(grep 'CONFIG_USB_ACM=' out/.config || echo 'MISSING!')"
          echo "USB_SERIAL: $(grep 'CONFIG_USB_SERIAL=' out/.config || echo 'MISSING!')"
          echo "USB_SERIAL_CDC_ACM: $(grep 'CONFIG_USB_SERIAL_CDC_ACM=' out/.config || echo 'MISSING!')"
          echo "USB: $(grep '^CONFIG_USB=' out/.config || echo 'MISSING!')"
          echo "TTY: $(grep '^CONFIG_TTY=' out/.config || echo 'MISSING!')"
          echo "BT_HCIBTUSB: $(grep 'CONFIG_BT_HCIBTUSB=' out/.config || echo 'MISSING!')"
          echo "BT_HCIUART: $(grep 'CONFIG_BT_HCIUART=' out/.config || echo 'MISSING!')"

          if ! grep -q "CONFIG_USB_ACM=y" out/.config; then
            echo "FATAL: USB_ACM still not enabled after forcing!"
            exit 1
          fi

          # Step 4: Build
          echo "=== Starting kernel build ==="
          make O=out CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 IAS=1 ARCH=arm64 -j$(nproc) 2>&1 | tee build.log

          # Step 5: Verify built Image contains the driver
          echo "=== Verifying built Image ==="
          if strings out/arch/arm64/boot/Image | grep -q "acm_probe\|cdc_acm_init\|USB Modem"; then
            echo "SUCCESS: USB_ACM driver symbols found in Image!"
          else
            echo "WARNING: USB_ACM driver symbols NOT found in Image. Checking strings..."
            strings out/arch/arm64/boot/Image | grep -i "acm\|cdc\|serial" | head -20
          fi

      - name: Package AnyKernel3
        run: |
          cp out/arch/arm64/boot/Image .
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git /tmp/ak3
          mkdir -p nethunter-kernel
          cp /tmp/ak3/META-INF -r nethunter-kernel/
          cp /tmp/ak3/tools -r nethunter-kernel/
          cp /tmp/ak3/anykernel.sh nethunter-kernel/
          cp Image nethunter-kernel/

          # Configure anykernel.sh for POCO M3 (citrus/bengal)
          sed -i 's/do.devicecheck=1/do.devicecheck=0/' nethunter-kernel/anykernel.sh
          sed -i 's/is_slot_device=1/is_slot_device=0/' nethunter-kernel/anykernel.sh
          # Uncomment and set the correct block device for citrus
          sed -i 's|^#block=/dev/block/bootdevice/by-name/boot|block=/dev/block/bootdevice/by-name/boot|' nethunter-kernel/anykernel.sh
          sed -i 's|^#is_slot_device=0|is_slot_device=0|' nethunter-kernel/anykernel.sh

          cd nethunter-kernel
          zip -r9 ../nethunter-citrus-usb-nrf52.zip .
          cd ..
          ls -lh nethunter-citrus-usb-nrf52.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nethunter-citrus-kernel
          path: nethunter-citrus-usb-nrf52.zip
          retention-days: 30
