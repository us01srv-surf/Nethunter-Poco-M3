"name: Build Nethunter Kernel (citrus) with USB Serial + NRF52 BLEon:  push:    branches: [nethunter-stable]  workflow_dispatch:jobs:  build:    runs-on: ubuntu-22.04    timeout-minutes: 180    steps:      - name: Checkout kernel source        uses: actions/checkout@v4        with:          ref: nethunter-stable          submodules: recursive      - name: Install build dependencies        run: |          sudo apt-get update          sudo apt-get install -y \            bc bison build-essential ccache curl flex \            g++-multilib gcc-multilib git gnupg image-tools \            lib32ncurses5-dev lib32readline-dev libssl-dev \            libxml2/libxslt-dev lz4 zip zlib1g-dev \            python3 python3-pip python3-venv          sudo apt-get install -y libncurses-dev      - name: Setup Clang/LLVM Toolchain        run: |          mkdir -p toolchain          cd toolchain          wget -q https://github.com/nickcano/clang-16/releases/download/16.0.0/clang-16.0.0-x86_64-linux-gnu.tar.xz -O clang.tar.xz          tar xf clang.tar.xz --strip-components=1          rm clang.tar.xz          export PATH=$PWD/bin:$PATH          clang --version      - name: Apply USB Serial + NRF52 BLE config fragments        run: |          # Get base nh_defconfig          cp arch/arm64/configs/vendor/nh_defconfig arch/arm64/configs/vendor/nh_defconfig.orig                    # Enable USB Serial drivers (for ESP32, CH340, CP2102, FTDI, etc.)          cat >> arch/arm64/configs/vendor/nh_defconfig << 'CONFIG_EOF'# === USB Serial Support (ESP32 Maruder) ===CONFIG_USB_SERIAL=yCONFIG_USB_SERIAL_GENERIC=yCONFIG_USB_SERIAL_CDC_ACM=yCONFIG_USB_SERIAL_CH341=yCONFIG_USB_SERIAL_CP210X=yCONFIG_USB_SERIAL_FTDI_SIO=yCONFIG_USB_SERIAL_OPTION=yCONFIG_USB_SERIAL_PL2303=yCONFIG_USB_SERIAL_SIERIAL=yCONFIG_USB_SERIAL_SYMBOL=yCONFIG_USB_SERIAL_IPW=yCONFIG_USB_SERIAL_IPAQ=yCONFIG_USB_SERIAL_KEYSPAN_PDA=y# === NRF52 BLE Support ===CONFIG_BT=yCONFIG_BT_BREDR=yCONFIG_BT_LE=yCONFIG_BT_HCIBTUSB=yCONFIG_BT_HCIBTUSB_BCM=yCONFIG_BT_HCIBTUSB_RTL=yCONFIG_BT_HCIBTUSB_NXP=yCONFIG_BT_HCIUART=yCONFIG_BT_HCIUART_H4=yCONFIG_BT_HCIUART_LL=yCONFIG_BT_HCIUART_3WIRE=yCONFIG_BT_HCIVHCI=yCONFIG_BT_6LOWPAN=yCONFIG_BT_LE_L2PRIVACY=yCONFIG_BT_ECDH=yCONFIG_BT_SELFTEST=yCONFIG_BT_DEBUGFS=yCONFIG_BT_HCIUART_NXP=yCONFIG_BT_HCIBFUSB=yCONFIG_BT_HCIBPA10X=yCONFIG_BT_HCIBCM203X=yCONFIG_BT_HCIBCM20730=yCONFIG_BT_HCIBPA10X=yCONFIG_BT_HCISDIO=yCONFIG_BT_HIDP=yCONFIG_BT_RFCOMM=yCONFIG_BT_BNEP=yCONFIG_BT_CMTP=y# === USB Host / OTG Support ===CONFIG_USB_OTG=yCONFIG_USB_XHCI_HCD=yCONFIG_USB_EHCI_HCD=yCONFIG_USB_OHCI_HCD=yCONFIG_USB_STORAGE=yCONFIG_USB_UAS=yCONFIG_USB_ACM=y# === CDC / NCM Network (ESP32 native USB) ===CONFIG_USB_NET_CDC_EEM=yCONFIG_USB_NET_CDC_NCM=yCONFIG_USB_NET_CDC_MBIM=y# === Generic USB Gadget ===CONFIG_USB_G_SERIAL=yCONFIG_USB_G_ECM=yCONFIG_USB_GADGET=yCONFIG_USB_CONFIGFS=yCONFIG_USB_CONFIGFS_SERIAL=yCONFIG_USB_CONFIGFS_ACM=yCONFIG_EOF                    echo \"Config fragment applied successfully\"      - name: Build kernel        run: |          export PATH=$PWD/toolchain/bin:$PATH          export KBUILD_BUILD_USER=nh-builder          export KBUILD_BUILD_HOST=github-actions                    make O=out \            CROSS_COMPILE=aarch64-linux-gnu- \            LLVM=1 \            ARCH=arm64 \            vendor/nh_defconfig                    make O=out \            CROSS_COMPILE=aarch64-linux-gnu- \            LLVM=1 \            ARCH=arm64 \            -j$(nproc) 2>&1 | tee build.log                    echo \"Build completed with exit code: $?\"      - name: Package AnyKernel3 zip        run: |          # Copy built Image          cp out/arch/arm64/boot/Image .                    # Create AnyKernel3 package          mkdir -p nethunter-kernel-package/META-INF/com/google/android                    # Download AnyKernel3          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git /tmp/ak3          cp -r /tmp/ak3/META-INF nethunter-kernel-package/          cp -r /tmp/ak3/tools nethunter-kernel-package/          cp /tmp/ak3/anykernel.sh nethunter-kernel-package/          cp Image nethunter-kernel-package/                    # Modify anykernel.sh for citrus          sed -i 's/do.devicecheck=1/do.devicecheck=0/' nethunter-kernel-package/anykernel.sh          sed -i 's/is_slot_device=1/is_slot_device=0/' nethunter-kernel-package/anykernel.sh          sed -i 's|block=/dev/block/bootdevice/by-name/boot|block=/dev/block/by-name/boot|' nethunter-kernel-package/anykernel.sh                    # Add version info          cat > nethunter-kernel-package/version << 'VER_EOF'          Nethunter Kernel for POCO M3 (citrus)          Built with USB Serial + NRF52 BLE support          Android 15 compatible          VER_EOF                    cd nethunter-kernel-package          zip -r9 ../nethunter-citrus-usbserial-nrf52.zip .          cd ..          ls -lh nethunter-citrus-usbserial-nrf52.zip      - name: Upload build artifact        uses: actions/upload-artifact@v4        with:          name: nethunter-citrus-kernel          path: nethunter-citrus-usbserial-nrf52.zip          retention-days: 30"